<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimePulse Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">⏱ TimePulse</span>
      </div>
      <nav>
        <a href="#" class="nav-link active" data-view="today">Vandaag</a>
        <a href="#" class="nav-link" data-view="history">Geschiedenis</a>
        <a href="/platforms.html" class="nav-link">Platforms</a>
      </nav>
      <div class="sidebar-footer">
        <div class="harvest-status" id="harvestStatus">
          <span class="dot"></span> Laden…
        </div>
        <div id="userInfo" style="display:none;margin-top:8px;">
          <div id="userEmail" class="user-email"></div>
          <button id="logoutBtn" class="logout-btn">Afmelden</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <div class="date-nav">
          <button id="prevDay" class="icon-btn">‹</button>
          <span id="dateLabel" class="date-label"></span>
          <button id="nextDay" class="icon-btn">›</button>
        </div>
        <div class="topbar-right">
          <span class="total-label">Harvest totaal:</span>
          <span class="total-hours" id="totalHours">…</span>
        </div>
      </div>

      <!-- Gaps alert -->
      <div id="gapsAlert" class="gaps-alert" style="display:none">
        <strong id="gapsAlertCount"></strong>
        <span id="gapsAlertText"></span>
      </div>

      <!-- Timeline -->
      <section class="section">
        <h2 class="section-title">Activiteit tijdlijn</h2>
        <div class="timeline-wrapper">
          <div class="timeline-hours" id="timelineHours"></div>
          <div class="timeline-track" id="timelineTrack">
            <div class="timeline-loading">Laden…</div>
          </div>
        </div>
      </section>

      <!-- Harvest entries + gaps side by side -->
      <div class="two-col">
        <section class="section">
          <h2 class="section-title">Harvest registraties</h2>
          <div id="harvestList"><div class="empty">Laden…</div></div>
        </section>

        <section class="section">
          <h2 class="section-title">Gaten <span class="badge" id="gapsBadge" style="display:none"></span></h2>
          <div id="gapsList"><div class="empty">Laden…</div></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Add to Harvest modal -->
  <div class="modal-backdrop" id="modalBackdrop" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>Toevoegen aan Harvest</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>Tijdblok</label>
          <div class="time-inputs">
            <input type="time" id="modalStart" />
            <span>–</span>
            <input type="time" id="modalEnd" />
            <span id="modalDuration" class="duration-badge"></span>
          </div>
        </div>
        <div class="form-row">
          <label>Project</label>
          <select id="modalProject"><option value="">Laden…</option></select>
        </div>
        <div class="form-row">
          <label>Taak</label>
          <select id="modalTask" disabled><option value="">Selecteer eerst een project</option></select>
        </div>
        <div class="form-row">
          <label>Notities</label>
          <textarea id="modalNotes" rows="3" placeholder="Optionele beschrijving van het werk…"></textarea>
        </div>
        <div class="form-row">
          <label>Actieve domeinen tijdens dit blok</label>
          <div class="domains-hint" id="modalDomains"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modalCancel">Annuleren</button>
        <button class="btn-primary" id="modalSubmit">Toevoegen aan Harvest</button>
      </div>
    </div>
  </div>

  <!-- Login overlay -->
  <div class="login-overlay" id="loginOverlay" style="display:none">
    <div class="login-card">
      <div class="login-logo">⏱ TimePulse</div>
      <h2 class="login-title">Aanmelden</h2>
      <div class="form-row">
        <label>E-mailadres</label>
        <input type="email" id="loginEmail" placeholder="je@email.com" autocomplete="email" />
      </div>
      <div class="form-row">
        <label>Wachtwoord</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div id="loginError" class="login-error" style="display:none"></div>
      <button class="btn-primary" id="loginBtn" style="width:100%;margin-top:4px">Aanmelden</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
